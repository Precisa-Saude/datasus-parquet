name: CI/CD

# Orchestrator enxuto — datasus-parquet é repo scripts-only (não publica
# npm, não tem site), então só rodamos checks em PRs e pushes.
# Release do dataset (não de código) vive em refresh.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
    secrets: inherit

  review:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/review.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
