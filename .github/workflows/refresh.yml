name: refresh

# Sonda o FTP DATASUS e, quando há publicação nova, reprocessa a janela
# revisável (competência mais recente + 12 anteriores, todas as UFs), confere
# cada partição contra o FTP, sincroniza com o S3, invalida o CloudFront,
# atualiza o state, publica a GitHub Release (webhook Zenodo → DOI) e dispara
# o refresh do datasus-viz. Desenho em #46.
#
# Por que a janela inteira: cada publicação mensal do DATASUS reescreve as 12
# competências anteriores à nova (padrão das datas no FTP). Sem delta nenhum
# contra o state, o run é no-op — o custo fica em uma janela (~350 partições,
# 8–10 h) por mês.
#
# Por que o runner self-hosted: no runner do GitHub o teto é 3 h e o upload
# só acontece no fim; em 14/09 e 21/09/2026 a fila estourou o teto sem
# publicar nada. O archive roda sob o watchdog e grava num diretório próprio
# do run (`build-refresh/`), para que sobras de backfills anteriores no
# `build/` do runner nunca sejam sincronizadas por engano.
#
# Cadência: segunda-feira 06:00 UTC.
#
# Secrets: S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID (opcional), RELEASE_APP_ID e
# RELEASE_APP_PRIVATE_KEY (token do bot para commit do state e para disparar o
# refresh do datasus-viz). As credenciais AWS do job de archive são as do
# próprio runner, como no backfill.yml.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — só detecta, sem archive/upload'
        type: boolean
        default: false
      forceManifest:
        description: 'Reconstrói o manifest.json mesmo sem competência nova (usar após backfill)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hasNew: ${{ steps.detect.outputs.hasNew }}
      pendingCount: ${{ steps.detect.outputs.pendingCount }}
      latestCompetencia: ${{ steps.detect.outputs.latestCompetencia }}
      windowStart: ${{ steps.detect.outputs.windowStart }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: detect
        # Janela de 13: só entra inteira quando há delta contra o state.
        run: pnpm detect-new -- --window 13
      - name: Resumo da detecção
        run: |
          {
            echo "## Detecção"
            echo ""
            echo "- Pendentes: ${{ steps.detect.outputs.pendingCount || 0 }}"
            echo "- Competência mais recente: ${{ steps.detect.outputs.latestCompetencia || '—' }}"
            echo "- Janela reprocessada a partir de: ${{ steps.detect.outputs.windowStart || '— (sem publicação nova)' }}"
            echo ""
            jq -r '.pending | group_by(.reason) | map("- \(.[0].reason): \(length)") | .[]' state/pending.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending
          path: state/pending.json
          retention-days: 7

  archive:
    needs: detect
    if: >-
      (needs.detect.outputs.hasNew == 'true' || inputs.forceManifest) &&
      inputs.dryRun != true
    runs-on: [self-hosted, linux, archive]
    timeout-minutes: 1440
    env:
      AWS_REGION: sa-east-1
      HAS_NEW: ${{ needs.detect.outputs.hasNew }}
    steps:
      - name: Generate release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install deps (mise gerencia node/pnpm no runner)
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          node -v && pnpm -v && aws --version
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending
          path: state/

      # Diretório próprio do run: o build/ do runner guarda partições de
      # backfills antigos, e o `aws s3 sync` sobe qualquer arquivo de tamanho
      # diferente — inclusive um mais velho que o do S3.
      - name: Prepara diretório do run
        run: rm -rf build-refresh build-rejected

      - name: Archive SIA-PA (watchdog, mais recente primeiro)
        if: env.HAS_NEW == 'true'
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          bash scripts/archive-watchdog.sh \
            --from-pending state/pending.json \
            --order newest-first \
            --out build-refresh/sia-pa \
            --throttle-ms 100 \
            --year-pause-ms 0

      - name: Verifica partições contra o FTP
        id: verify
        if: env.HAS_NEW == 'true'
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          pnpm verify-partitions -- \
            --from-pending state/pending.json \
            --build-dir build-refresh \
            --rejected-dir build-rejected

      - name: Emit provenance (SHA256 + schema + metadata)
        if: env.HAS_NEW == 'true'
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          pnpm emit-provenance -- --build-dir build-refresh --out build-refresh

      - name: Upload das partições verificadas para o S3
        if: env.HAS_NEW == 'true'
        run: |
          aws s3 sync build-refresh/ "s3://${{ secrets.S3_BUCKET }}/" \
            --exclude '*_archive-run.json' \
            --exclude '_verified.json' \
            --exclude '*.ndjson' \
            --cache-control 'public, max-age=3600'

      - name: Lista partições no bucket
        run: |
          aws s3 ls "s3://${{ secrets.S3_BUCKET }}/" --recursive > /tmp/s3-listing.txt
          wc -l /tmp/s3-listing.txt

      - name: Build manifest (a partir do bucket)
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          pnpm build-manifest -- --s3-listing /tmp/s3-listing.txt

      - name: Verifica que o manifest novo não regride o publicado
        run: |
          REMOTE=$(aws s3 cp "s3://${{ secrets.S3_BUCKET }}/manifest.json" - 2>/dev/null || echo '{}')
          REMOTE_PARTS=$(echo "$REMOTE" | jq '[.datasets[].partitions] | add // 0')
          LOCAL_PARTS=$(jq '[.datasets[].partitions] | add // 0' build/manifest.json)
          echo "remote=$REMOTE_PARTS local=$LOCAL_PARTS"
          if [ "$LOCAL_PARTS" -lt "$REMOTE_PARTS" ]; then
            echo "::error::manifest novo ($LOCAL_PARTS partições) regride o publicado ($REMOTE_PARTS) — abortando upload"
            exit 1
          fi

      - name: Upload manifest.json
        run: |
          aws s3 cp build/manifest.json "s3://${{ secrets.S3_BUCKET }}/manifest.json" \
            --content-type 'application/json' \
            --cache-control 'public, max-age=3600'

      # /sia-pa/* entra porque a janela reescreve objetos que já existiam.
      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: ${{ env.DIST_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths '/manifest.json' '/*/provenance/*' '/sia-pa/*'

      - name: Atualizar state (só partições verificadas)
        if: env.HAS_NEW == 'true'
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          pnpm detect-new -- --mark-processed \
            --build-dir build-refresh \
            --verified build-refresh/_verified.json

      # Token novo antes do push: o do início do job vale 60 min e o archive
      # da janela leva horas (mesmo motivo do backfill.yml).
      - name: Renovar token do release-bot para o push
        id: app-token-push
        if: env.HAS_NEW == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit state atualizado
        if: env.HAS_NEW == 'true'
        run: |
          eval "$("$HOME"/.local/bin/mise activate bash)"
          if git diff --quiet -- state/sia-pa.json; then
            echo 'state inalterado — skip commit'
            exit 0
          fi
          git config user.name 'precisa-saude-release-bot[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add state/sia-pa.json
          git commit -m "chore(data): refresh state ${{ needs.detect.outputs.latestCompetencia }}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${{ steps.app-token-push.outputs.token }}@github.com/${{ github.repository }}.git"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Criar GitHub Release (dispara webhook Zenodo → DOI)
        if: env.HAS_NEW == 'true' && steps.verify.outputs.verifiedCount != '0'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ steps.app-token-push.outputs.token }}
          tag_name: dataset-${{ needs.detect.outputs.latestCompetencia }}
          name: Dataset ${{ needs.detect.outputs.latestCompetencia }}
          body: |
            Refresh automático: **${{ steps.verify.outputs.verifiedCount }}** partições
            reprocessadas e conferidas contra o FTP (janela a partir de
            **${{ needs.detect.outputs.windowStart || needs.detect.outputs.latestCompetencia }}**,
            mais recente: **${{ needs.detect.outputs.latestCompetencia }}**).

            Assets incluem `manifest.json`. Parquet e provenance por partição estão no CDN.
            Para validar byte-a-byte contra o FTP oficial, veja `docs/provenance.md`.

            DOI Zenodo emitido automaticamente via webhook — veja
            https://zenodo.org/search?q=Precisa-Saude/datasus-parquet.
          files: |
            build/manifest.json
          generate_release_notes: true

      - name: Token do release-bot para o datasus-viz
        id: app-token-viz
        if: env.HAS_NEW == 'true' && steps.verify.outputs.verifiedCount != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: datasus-viz
          permission-actions: write

      # O datasus-viz reagrega só as partições cujo Last-Modified mudou e, no
      # mesmo workflow, regenera os artefatos de atipicidade.
      - name: Dispara o refresh do datasus-viz
        if: env.HAS_NEW == 'true' && steps.verify.outputs.verifiedCount != '0'
        env:
          GH_TOKEN: ${{ steps.app-token-viz.outputs.token }}
        run: gh workflow run refresh.yml -R "${{ github.repository_owner }}/datasus-viz"

      - name: Falha se alguma partição foi rejeitada
        if: env.HAS_NEW == 'true' && steps.verify.outputs.rejectedCount != '0'
        run: |
          echo "::error::${{ steps.verify.outputs.rejectedCount }} partições divergiram do FTP e não foram publicadas — veja o resumo da verificação. Elas seguem pendentes para o próximo refresh."
          exit 1
