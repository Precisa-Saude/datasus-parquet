name: audit

# Auditoria mensal do bucket contra o FTP (#46): compara as linhas de cada
# `part.parquet` publicado no S3 (footer, sem baixar o arquivo) com o
# `recordCount` dos cabeçalhos dos DBCs no FTP (12 bytes por arquivo). Abre
# ou atualiza uma issue quando há divergência.
#
# Motivo: em 2026-10-01 a auditoria manual achou 2025-04..07 com versões
# antigas no S3 e RJ 2021-10 sem a variante `b`, embora o state dissesse que
# estava tudo processado.
#
# Dia 25: depois da publicação mensal do DATASUS (meados do mês) e do refresh
# de segunda que a reprocessa.

on:
  schedule:
    - cron: '0 9 25 * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Sessão de 3 h: a auditoria inteira leva ~1 h e a sessão padrão de 1 h
      # expirava no meio (HTTP 400 do S3, run 36936032619).
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1
          role-duration-seconds: 10800

      - name: Audita S3 × FTP
        id: audit
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: pnpm audit-partitions -- --out audit.json --markdown audit.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit
          path: |
            audit.json
            audit.md
          retention-days: 90

      # Uma issue aberta por vez: se já existe, comenta nela em vez de abrir outra.
      - name: Abre ou atualiza issue de divergência
        if: steps.audit.outputs.divergentCount != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.audit.outputs.divergentCount }}
        run: |
          EXISTING=$(gh issue list --state open --label audit --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file audit.md
          else
            gh label create audit --color FBCA04 --description 'Divergência S3 × FTP' 2>/dev/null || true
            gh issue create \
              --title "Auditoria S3 × FTP: $COUNT partições divergentes" \
              --label audit --label bug \
              --body-file audit.md
          fi
